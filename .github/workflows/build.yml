# Baut Kulisse.app (Apple Silicon + Intel) bei jedem Push.
#   Push auf main    -> Download unter Actions (Artefakt) und als Vorabversion "Neuester Stand" (Release "latest")
#   Tag v1.2.3       -> richtige Version: Release "Kulisse v1.2.3" mit Kulisse-macOS.zip
#   von Hand         -> Actions → "App bauen" → Run workflow
name: App bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          swiftc --version

      - name: Bauen (Universal)
        run: cd src && UNIVERSAL=1 ./build.sh

      - name: Prüfen
        run: |
          lipo -archs Kulisse.app/Contents/MacOS/Kulisse
          lipo -archs Kulisse.app/Contents/Resources/Kulisse.saver/Contents/MacOS/KulisseSaver
          codesign --verify --deep Kulisse.app
          plutil -p Kulisse.app/Contents/Info.plist | grep -E "ShortVersion|BundleVersion"

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent Kulisse.app Kulisse-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kulisse-macOS-${{ env.VERSION }}
          path: Kulisse-macOS.zip

      - name: Release "Neuester Stand" aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Kulisse-macOS.zip --prerelease --target "$GITHUB_SHA" \
            --title "Neuester Stand (${VERSION})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Erster Start: Rechtsklick auf Kulisse.app → Öffnen (nicht notarisiert)."

      - name: Release für Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Kulisse-macOS.zip --title "Kulisse $GITHUB_REF_NAME" --generate-notes
